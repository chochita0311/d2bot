[package]
name = "d2bot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Windows screen-based Diablo II helper"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "bmp"] }
jpeg-decoder = { version = "0.3.2", default-features = false, features = ["platform_independent"] }
png = "0.18.1"
rand = { version = "=0.9.2", default-features = false, features = ["std", "std_rng", "os_rng"] }
rayon = "=1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10.9"
wide = "=1.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_Pipes"] }

[dev-dependencies]
flate2 = "=1.1.10"
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std", "simd"] }
